<!DOCTYPE html>
<html>
  <body style="font-family: Georgia, 'Times New Roman', serif; color: #1a1a1a; line-height: 1.6; max-width: 520px; margin: 0 auto; padding: 24px;">
    <p style="font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: #4a7c59;">The Fourth Clover</p>
    <h1 style="font-size: 22px; font-weight: 600; margin: 8px 0 16px;">Reset your password</h1>
    <p style="font-size: 16px; color: #333;">
      We received a request to reset the password for <strong>{{ .Email }}</strong>.
    </p>
    <p style="margin: 28px 0;">
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/auth/reset-password"
        style="display: inline-block; background: #111; color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 999px; font-size: 15px;"
      >
        Choose a new password
      </a>
    </p>
    <p style="font-size: 14px; color: #666;">
      This link expires soon and can only be used once. If you did not request a reset, you can ignore this email.
    </p>
    <p style="font-size: 12px; color: #999; margin-top: 32px;">
      Minimal blogging — clear by design.
    </p>
  </body>
</html>
